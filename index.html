<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estante Estratégica</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="capa.jpg">
  <meta name="theme-color" content="#121214">
</head>
<body>

  <!-- Vídeo do Topo -->
  <div class="video-container">
    <video id="owlVideo" loop playsinline muted autoplay>
      <source src="coruja.mp4" type="video/mp4">
      Seu navegador não suporta a exibição deste vídeo.
    </video>
    <button id="soundBtn" onclick="toggleVideoSound()">🔇 Ativar Som</button>
  </div>

  <header>
    <h1 id="appTitleText">Estante Estratégica</h1>
    <p id="appSubtitleText">Hub de Inteligência & Fontes Personalizadas</p>

    <!-- Barra de Progresso Diária -->
    <div id="dailyProgress" class="progress-bar-container">
      <span id="progressText">Leituras de hoje: 0 / 0</span>
      <div class="progress-track">
        <div id="progressFill" class="progress-fill" style="width: 0%;"></div>
      </div>
    </div>

    <!-- Campo de Pesquisa -->
    <div class="search-container">
      <input type="text" id="searchInput" oninput="filterShortcuts()" placeholder="🔍 Pesquisar atalho...">
    </div>

    <!-- BOTOES DE AÇÃO NO TOPO -->
    <div class="top-actions-bar">
      <button id="addCategoryBtn" class="btn-action" onclick="toggleCategoryPanel()">🏷️ + Categoria</button>
      <button id="configBtn" class="btn-action" onclick="toggleConfig()">⚙️ Personalizar Estante</button>
    </div>

    <!-- Barra Dinâmica de Categorias -->
    <div class="category-bar" id="categoryBar">
      <!-- Gerado via JavaScript -->
    </div>
  </header>

  <!-- PAINEL EXCLUSIVO PARA CRIAR CATEGORIAS -->
  <div id="categoryPanel" class="config-panel hidden">
    <h3>🏷️ Criar e Gerenciar Categorias</h3>
    <form onsubmit="handleAddCategory(event)" class="config-group">
      <input type="text" id="newCatName" placeholder="Nome da Categoria (ex: Esportes, Filmes...)" required>
      <input type="text" id="newCatEmoji" placeholder="Emoji (ex: ⚽, 🎬)" style="width: 100px;">
      <button type="submit" class="btn-primary" style="margin-top: 8px;">+ Salvar Nova Categoria</button>
    </form>
    
    <hr class="divider">
    
    <h4>Categorias Existentes:</h4>
    <div id="categoryManageList" class="category-manage-list">
      <!-- Lista de categorias para exclusão via JS -->
    </div>
    
    <button type="button" class="btn-secondary" onclick="toggleCategoryPanel()" style="margin-top: 15px;">Fechar</button>
  </div>

  <!-- PAINEL DE CONFIGURAÇÕES GERAIS -->
  <div id="configPanel" class="config-panel hidden">
    <h3>🎨 Aparência da Estante</h3>
    
    <div class="config-group">
      <label>Título da Estante:</label>
      <input type="text" id="titleInput" onchange="updateAppTitle(this.value)" placeholder="Nome da Estante">
    </div>

    <div class="config-group">
      <label>Cor de Fundo da Estante:</label>
      <input type="color" id="bgColorPicker" onchange="changeBgColor(this.value)">
    </div>

    <div class="config-group">
      <label>Cor dos Cartões:</label>
      <input type="color" id="cardColorPicker" onchange="changeCardColor(this.value)">
    </div>

    <div class="config-group">
      <label>Modelo de Borda:</label>
      <select id="borderRadiusSelect" onchange="changeCardStyle(this.value)">
        <option value="8px">Arredondado Leve</option>
        <option value="18px">Arredondado Suave</option>
        <option value="0px">Quadrado</option>
      </select>
    </div>

    <hr class="divider">

    <h3>💾 Backup dos Dados</h3>
    <div class="config-group">
      <button type="button" class="btn-primary" onclick="exportBackup()">📥 Baixar Backup (JSON)</button>
    </div>

    <hr class="divider">

    <h3 id="formTitle">➕ Adicionar / Editar Atalho</h3>
    <form id="shortcutForm" onsubmit="handleShortcutSubmit(event)">
      <input type="hidden" id="editIndex" value="-1">
      
      <input type="text" id="shortcutTitle" placeholder="Nome do Atalho" required>
      <input type="url" id="shortcutUrl" placeholder="Link do Site (https://...)" required>
      
      <label for="shortcutCategory">Categoria do Atalho:</label>
      <select id="shortcutCategory" required>
        <!-- As categorias serão inseridas dinamicamente aqui -->
      </select>

      <label>Capa do Atalho (Foto da Galeria ou Emoji):</label>
      <input type="file" id="shortcutImage" accept="image/*">
      <input type="text" id="shortcutEmoji" placeholder="Ou digite um Emoji (ex: 📚, ⚖️, 🌐)">
      
      <div class="form-buttons">
        <button type="submit" class="btn-primary" id="saveBtn">Salvar Atalho</button>
        <button type="button" class="btn-secondary hidden" id="cancelBtn" onclick="resetForm()">Cancelar Edição</button>
      </div>
    </form>
  </div>

  <main class="bookshelf">
    <div class="cards-container" id="cardsContainer"></div>
  </main>

  <script>
    let currentCategory = 'todas';
    let draggedIndex = null;

    let appSettings = JSON.parse(localStorage.getItem('estante_config')) || {
      title: 'Estante Estratégica',
      bg: '#121214',
      cardBg: '#202024',
      borderRadius: '12px'
    };

    let customCategories = JSON.parse(localStorage.getItem('estante_categories')) || [
      { id: 'vagas', name: 'Vagas', emoji: '💼' },
      { id: 'economia', name: 'Economia & Agro', emoji: '📈' },
      { id: 'noticias', name: 'Notícias', emoji: '🌐' },
      { id: 'tech', name: 'Tech & Espaço', emoji: '🚀' },
      { id: 'religiao', name: 'Religião', emoji: '🙏' }
    ];

    let shortcuts = JSON.parse(localStorage.getItem('estante_shortcuts')) || [
      { id: '1', title: 'PCI Concursos', url: 'https://www.pciconcursos.com.br', image: '', emoji: '📚', read: false, category: 'vagas' },
      { id: '2', title: 'Wired Tech', url: 'https://www.wired.com', image: '', emoji: '🚀', read: false, category: 'tech' }
    ];

    function init() {
      checkDailyResetAt2AM();
      applySettings();
      renderCategoriesUI();
      renderCategoryDropdown();
      renderShortcuts();

      const video = document.getElementById('owlVideo');
      if (video) {
        video.play().catch(() => {});
      }
    }

    function toggleVideoSound() {
      const video = document.getElementById('owlVideo');
      const btn = document.getElementById('soundBtn');

      if (video.paused) {
        video.play();
      }

      if (video.muted) {
        video.muted = false;
        btn.innerText = "🔊 Desativar Som";
        btn.classList.add("sound-on");
      } else {
        video.muted = true;
        btn.innerText = "🔇 Ativar Som";
        btn.classList.remove("sound-on");
      }
    }

    function checkDailyResetAt2AM() {
      const now = new Date();
      const operationalDate = new Date(now.getTime() - (2 * 60 * 60 * 1000)).toDateString();
      const lastReset = localStorage.getItem('estante_last_reset');

      if (lastReset !== operationalDate) {
        shortcuts.forEach(item => item.read = false);
        localStorage.setItem('estante_last_reset', operationalDate);
        saveShortcuts();
      }
    }

    function applySettings() {
      document.getElementById('appTitleText').innerText = appSettings.title;
      document.getElementById('titleInput').value = appSettings.title;
      document.body.style.backgroundColor = appSettings.bg;
      document.getElementById('bgColorPicker').value = appSettings.bg;
      document.getElementById('cardColorPicker').value = appSettings.cardBg;
      document.getElementById('borderRadiusSelect').value = appSettings.borderRadius;
    }

    function toggleConfig() {
      document.getElementById('categoryPanel').classList.add('hidden');
      document.getElementById('configPanel').classList.toggle('hidden');
    }

    function toggleCategoryPanel() {
      document.getElementById('configPanel').classList.add('hidden');
      const panel = document.getElementById('categoryPanel');
      panel.classList.toggle('hidden');
      if (!panel.classList.contains('hidden')) {
        renderCategoryManageList();
      }
    }

    function handleAddCategory(e) {
      e.preventDefault();
      const name = document.getElementById('newCatName').value.trim();
      const emoji = document.getElementById('newCatEmoji').value.trim() || '🏷️';
      
      if (!name) return;

      const id = 'cat_' + Date.now();
      customCategories.push({ id, name, emoji });
      
      localStorage.setItem('estante_categories', JSON.stringify(customCategories));
      
      document.getElementById('newCatName').value = '';
      document.getElementById('newCatEmoji').value = '';

      renderCategoriesUI();
      renderCategoryDropdown();
      renderCategoryManageList();
    }

    function removeCategory(id) {
      if (confirm("Tem certeza que deseja apagar esta categoria?")) {
        customCategories = customCategories.filter(c => c.id !== id);
        localStorage.setItem('estante_categories', JSON.stringify(customCategories));
        renderCategoriesUI();
        renderCategoryDropdown();
        renderCategoryManageList();
      }
    }

    function renderCategoryManageList() {
      const listContainer = document.getElementById('categoryManageList');
      listContainer.innerHTML = '';
      
      customCategories.forEach(cat => {
        const item = document.createElement('div');
        item.style.cssText = 'display: flex; justify-content: space-between; align-items: center; margin-top: 8px; background: rgba(255,255,255,0.05); padding: 6px 12px; border-radius: 6px;';
        item.innerHTML = `
          <span>${cat.emoji} ${cat.name}</span>
          <button onclick="removeCategory('${cat.id}')" style="background:none; border:none; color:#ff4d4d; cursor:pointer;">🗑️</button>
        `;
        listContainer.appendChild(item);
      });
    }

    function renderCategoriesUI() {
      const bar = document.getElementById('categoryBar');
      bar.innerHTML = `<button class="tab-btn ${currentCategory === 'todas' ? 'active' : ''}" onclick="setCategoryFilter('todas', this)">Todas</button>`;

      customCategories.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = `tab-btn ${currentCategory === cat.id ? 'active' : ''}`;
        btn.innerText = `${cat.emoji} ${cat.name}`;
        btn.onclick = (e) => setCategoryFilter(cat.id, btn);
        bar.appendChild(btn);
      });
    }

    function renderCategoryDropdown() {
      const select = document.getElementById('shortcutCategory');
      select.innerHTML = '';

      customCategories.forEach(cat => {
        const opt = document.createElement('option');
        opt.value = cat.id;
        opt.innerText = `${cat.emoji} ${cat.name}`;
        select.appendChild(opt);
      });
    }

    function updateAppTitle(val) {
      appSettings.title = val || 'Estante Estratégica';
      document.getElementById('appTitleText').innerText = appSettings.title;
      saveSettings();
    }

    function changeBgColor(color) {
      appSettings.bg = color;
      document.body.style.backgroundColor = color;
      saveSettings();
    }

    function changeCardColor(color) {
      appSettings.cardBg = color;
      saveSettings();
      renderShortcuts();
    }

    function changeCardStyle(radius) {
      appSettings.borderRadius = radius;
      saveSettings();
      renderShortcuts();
    }

    function saveSettings() {
      localStorage.setItem('estante_config', JSON.stringify(appSettings));
    }

    function saveShortcuts() {
      try {
        localStorage.setItem('estante_shortcuts', JSON.stringify(shortcuts));
      } catch (e) {
        alert("A imagem selecionada é muito grande. Tente uma foto menor.");
      }
    }

    function compressImage(file, callback) {
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          const maxDim = 200;
          let width = img.width;
          let height = img.height;

          if (width > height) {
            if (width > maxDim) {
              height *= maxDim / width;
              width = maxDim;
            }
          } else {
            if (height > maxDim) {
              width *= maxDim / height;
              height = maxDim;
            }
          }
          canvas.width = width;
          canvas.height = height;
          ctx.drawImage(img, 0, 0, width, height);
          callback(canvas.toDataURL('image/jpeg', 0.7));
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function markAsRead(index, e) {
      if (e) e.stopPropagation();
      shortcuts[index].read = true;
      saveShortcuts();
      renderShortcuts();
    }

    function toggleReadStatus(index, e) {
      e.stopPropagation();
      shortcuts[index].read = !shortcuts[index].read;
      saveShortcuts();
      renderShortcuts();
    }

    function updateProgressBar() {
      const total = shortcuts.length;
      const readCount = shortcuts.filter(s => s.read).length;
      const percentage = total > 0 ? Math.round((readCount / total) * 100) : 0;

      document.getElementById('progressText').innerText = `Leituras de hoje: ${readCount} / ${total} (${percentage}%)`;
      document.getElementById('progressFill').style.width = `${percentage}%`;
    }

    function setCategoryFilter(category, btnElement) {
      currentCategory = category;
      const buttons = document.querySelectorAll('.tab-btn');
      buttons.forEach(btn => btn.classList.remove('active'));
      if (btnElement) btnElement.classList.add('active');
      filterShortcuts();
    }

    function filterShortcuts() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      renderShortcuts(query);
    }

    function handleDragStart(e, index) {
      draggedIndex = index;
      e.dataTransfer.effectAllowed = 'move';
      e.target.classList.add('dragging');
    }

    function handleDragOver(e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
    }

    function handleDrop(e, targetIndex) {
      e.preventDefault();
      if (draggedIndex === null || draggedIndex === targetIndex) return;

      const itemMoved = shortcuts.splice(draggedIndex, 1)[0];
      shortcuts.splice(targetIndex, 0, itemMoved);

      saveShortcuts();
      renderShortcuts();
    }

    function handleDragEnd(e) {
      e.target.classList.remove('dragging');
      draggedIndex = null;
    }

    function renderShortcuts(filterText = '') {
      const container = document.getElementById('cardsContainer');
      container.innerHTML = '';

      shortcuts.forEach((item, index) => {
        const itemCategory = item.category || 'vagas';

        if (currentCategory !== 'todas' && itemCategory !== currentCategory) return;
        if (filterText && !item.title.toLowerCase().includes(filterText)) return;

        const card = document.createElement('div');
        card.className = `card ${item.read ? 'card-read' : ''}`;
        card.style.backgroundColor = appSettings.cardBg;
        card.style.borderRadius = appSettings.borderRadius;
        
        card.draggable = true;
        card.ondragstart = (e) => handleDragStart(e, index);
        card.ondragover = (e) => handleDragOver(e);
        card.ondrop = (e) => handleDrop(e, index);
        card.ondragend = (e) => handleDragEnd(e);

        const coverHtml = item.image 
          ? `<img src="${item.image}" class="card-img" alt="Capa">`
          : `<div class="card-icon">${item.emoji || '🌐'}</div>`;

        const statusBadge = item.read 
          ? `<button class="read-badge badge-active" onclick="toggleReadStatus(${index}, event)" title="Marcar como não lido">✅ Lido</button>`
          : `<button class="read-badge" onclick="toggleReadStatus(${index}, event)" title="Marcar como lido">⚪ Pendente</button>`;

        card.innerHTML = `
          <div class="card-header-status">
            ${statusBadge}
          </div>
          <a href="${item.url}" target="_blank" class="card-link" onclick="markAsRead(${index})">
            ${coverHtml}
            <span class="card-title">${item.title}</span>
          </a>
          <div class="card-controls">
            <button onclick="editShortcut(${index})" title="Editar / Trocar Capa">✏️</button>
            <button onclick="deleteShortcut(${index})" title="Excluir">🗑️</button>
          </div>
        `;

        container.appendChild(card);
      });

      updateProgressBar();
    }

    function handleShortcutSubmit(e) {
      e.preventDefault();
      const editIdx = parseInt(document.getElementById('editIndex').value);
      const title = document.getElementById('shortcutTitle').value;
      const url = document.getElementById('shortcutUrl').value;
      const category = document.getElementById('shortcutCategory').value;
      const emoji = document.getElementById('shortcutEmoji').value;
      const fileInput = document.getElementById('shortcutImage');

      const processSave = (imageData) => {
        const itemData = {
          id: editIdx >= 0 ? shortcuts[editIdx].id : Date.now().toString(),
          title: title,
          url: url,
          category: category,
          emoji: emoji,
          read: editIdx >= 0 ? shortcuts[editIdx].read : false,
          image: imageData !== null ? imageData : (editIdx >= 0 ? shortcuts[editIdx].image : '')
        };

        if (editIdx >= 0) {
          shortcuts[editIdx] = itemData;
        } else {
          shortcuts.push(itemData);
        }

        saveShortcuts();
        renderShortcuts();
        resetForm();
      };

      if (fileInput.files && fileInput.files[0]) {
        compressImage(fileInput.files[0], (compressedData) => {
          processSave(compressedData);
        });
      } else {
        processSave(null);
      }
    }

    function editShortcut(index) {
      const item = shortcuts[index];
      document.getElementById('editIndex').value = index;
      document.getElementById('shortcutTitle').value = item.title;
      document.getElementById('shortcutUrl').value = item.url;
      document.getElementById('shortcutCategory').value = item.category || 'vagas';
      document.getElementById('shortcutEmoji').value = item.emoji || '';
      document.getElementById('formTitle').innerText = '✏️ Editar Atalho / Trocar Capa';
      document.getElementById('saveBtn').innerText = 'Atualizar Atalho';
      document.getElementById('cancelBtn').classList.remove('hidden');
      
      document.getElementById('categoryPanel').classList.add('hidden');
      document.getElementById('configPanel').classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function deleteShortcut(index) {
      if (confirm(`Deseja apagar o atalho "${shortcuts[index].title}"?`)) {
        shortcuts.splice(index, 1);
        saveShortcuts();
        renderShortcuts();
      }
    }

    function resetForm() {
      document.getElementById('shortcutForm').reset();
      document.getElementById('editIndex').value = '-1';
      document.getElementById('formTitle').innerText = '➕ Adicionar / Editar Atalho';
      document.getElementById('saveBtn').innerText = 'Salvar Atalho';
      document.getElementById('cancelBtn').classList.add('hidden');
    }

    function exportBackup() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({
        config: appSettings,
        categories: customCategories,
        shortcuts: shortcuts
      }));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", "estante_estrategica_backup.json");
      document.body.app
